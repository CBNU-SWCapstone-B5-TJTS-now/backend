name: Deploy

# main에 반영되면 테스트 → 이미지 빌드/푸시 → EC2 배포 순서로 진행한다.
# 앞 단계가 실패하면 뒤 단계는 실행되지 않는다.
# 서버의 배포 스크립트가 blue-green으로 무중단 전환하며, 새 버전 헬스체크가 실패하면 전환하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포/롤백이 겹치지 않도록 하나씩만 실행한다 (rollback.yml과 같은 그룹).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 이미지 이름은 소문자만 허용된다. docker-compose.prod.yml의 image와 맞춘다.
  IMAGE: ghcr.io/cbnu-swcapstone-b5-tjts-now/backend
  HEALTH_URL: https://api.nowhere-app.cloud/actuator/health

jobs:
  test:
    runs-on: ubuntu-latest
    # @SpringBootTest가 DB/Redis에 붙기 때문에 application.yaml 기본값에 맞춰 띄운다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nowhere
          POSTGRES_USER: nowhere
          POSTGRES_PASSWORD: nowhere1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowhere -d nowhere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v6부터 Gradle 이용약관 동의 조건이 붙어 v5(Node 24 지원)를 사용한다.
      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # 커밋별 고유 태그. deploy job이 이 태그를 그대로 서버에 넘긴다.
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest: 가장 최근 빌드 / sha-xxxxxxx: 서버가 실제로 실행하는 커밋별 태그 (롤백용)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.tag }}

      # EC2 t3.micro가 x86_64라 amd64 단일 빌드
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # 알림에서 어느 단계가 실패했는지 구분하기 위해 내보낸다.
    outputs:
      server: ${{ steps.server.outcome }}
      public: ${{ steps.public.outcome }}
    steps:
      # 서버의 ~/backend는 main 클론이다. git pull로 compose 파일과 배포 스크립트를 최신화하고,
      # 이미지는 이 job의 GITHUB_TOKEN으로 로그인해 받는다 (서버에 장기 토큰을 두지 않음).
      # 새 버전 기동/헬스체크/Nginx 전환은 infra/deploy/deploy.sh가 서버 안에서 처리한다.
      - name: Deploy to EC2
        id: server
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          GITHUB_ACTIONS: 'true'
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG,GITHUB_ACTIONS
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/backend
            git pull --ff-only origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            bash infra/deploy/deploy.sh "$IMAGE_TAG"

      # 서버 안에서 이미 헬스체크를 통과했으므로, 여기서는 Nginx/HTTPS 경로까지 열려 있는지만 확인한다.
      - name: Health check (public)
        id: public
        run: |
          for i in $(seq 1 6); do
            if curl -fsS "$HEALTH_URL"; then
              echo
              echo "healthy (attempt $i)"
              exit 0
            fi
            echo "waiting... ($i/6)"
            sleep 5
          done
          echo "::error::외부 헬스체크 실패: $HEALTH_URL"
          exit 1

  # 앞 단계 결과와 상관없이 마지막에 Slack으로 결과를 알린다.
  # 알림 전송이 실패해도 배포 결과(초록불/빨간불)에는 영향을 주지 않는다.
  notify:
    needs: [test, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - id: result
        env:
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build-and-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SERVER: ${{ needs.deploy.outputs.server }}
          PUBLIC: ${{ needs.deploy.outputs.public }}
        run: |
          status=failure; stage=""; note=""
          if [[ "$DEPLOY" == success ]]; then
            status=success
            note="새 버전으로 무중단 전환 완료"
          elif [[ "$TEST" == cancelled || "$BUILD" == cancelled || "$DEPLOY" == cancelled ]]; then
            status=cancelled
            note="운영 서버 상태는 Actions 실행 기록에서 확인 필요"
          elif [[ "$TEST" == failure ]]; then
            stage="테스트"; note="배포되지 않음. 운영 서버는 기존 버전으로 계속 서비스 중"
          elif [[ "$BUILD" == failure ]]; then
            stage="이미지 빌드/푸시"; note="배포되지 않음. 운영 서버는 기존 버전으로 계속 서비스 중"
          elif [[ "$SERVER" == failure ]]; then
            stage="서버 배포"; note="새 버전으로 전환하지 않음. 운영 서버는 기존 버전으로 계속 서비스 중 (사유는 실행 기록 상단 오류 참고)"
          elif [[ "$PUBLIC" == failure ]]; then
            stage="외부 헬스체크"; note="*새 버전으로 전환됐지만 외부(HTTPS) 확인 실패. 확인 필요*"
          else
            stage="알 수 없음"; note="실행 기록 확인 필요"
          fi
          {
            echo "status=$status"
            echo "stage=$stage"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/slack-notify
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: 배포
          status: ${{ steps.result.outputs.status }}
          image-tag: ${{ needs.build-and-push.outputs.tag }}
          failed-stage: ${{ steps.result.outputs.stage }}
          note: ${{ steps.result.outputs.note }}
