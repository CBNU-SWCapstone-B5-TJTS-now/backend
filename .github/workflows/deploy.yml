name: Deploy

# main에 반영되면 테스트 → 이미지 빌드/푸시 → EC2 배포 순서로 진행한다.
# 앞 단계가 실패하면 뒤 단계는 실행되지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않도록 하나씩만 실행한다 (진행 중인 배포는 취소하지 않음).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 이미지 이름은 소문자만 허용된다. docker-compose.prod.yml의 image와 맞춘다.
  IMAGE: ghcr.io/cbnu-swcapstone-b5-tjts-now/backend
  HEALTH_URL: https://api.nowhere-app.cloud/actuator/health

jobs:
  test:
    runs-on: ubuntu-latest
    # @SpringBootTest가 DB/Redis에 붙기 때문에 application.yaml 기본값에 맞춰 띄운다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nowhere
          POSTGRES_USER: nowhere
          POSTGRES_PASSWORD: nowhere1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowhere -d nowhere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest: 서버가 받아 가는 태그 / sha-xxxxxxx: 롤백용으로 커밋마다 남기는 태그
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # EC2 t3.micro가 x86_64라 amd64 단일 빌드
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # 서버의 ~/backend는 main 클론이다. git pull로 compose 파일을 최신화하고,
      # 이미지는 이 job의 GITHUB_TOKEN으로 로그인해 받는다 (서버에 장기 토큰을 두지 않음).
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/backend
            git pull --ff-only origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app
            docker image prune -f

      # t3.micro는 기동이 느려서 5초 간격으로 최대 30번(약 2분 30초) 확인한다.
      # 실패해도 알리기만 하고 자동 롤백은 하지 않는다.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL"; then
              echo
              echo "healthy (attempt $i)"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 5
          done
          echo "::error::헬스체크 실패: $HEALTH_URL"
          exit 1
