services:
  postgres:
    image: postgres:16
    container_name: nowhere-postgres
    environment:
      POSTGRES_DB: nowhere
      POSTGRES_USER: nowhere
      POSTGRES_PASSWORD: nowhere1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nowhere-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  postgres-data:
