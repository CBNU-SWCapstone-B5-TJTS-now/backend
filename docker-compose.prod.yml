services:
  app:
    # GitHub Actions가 빌드해 GHCR에 올린 이미지를 받아서 실행한다 (서버에서 빌드하지 않음).
    image: ghcr.io/cbnu-swcapstone-b5-tjts-now/backend:latest
    container_name: nowhere-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    # Nginx(127.0.0.1:8080)만 접근. Docker는 방화벽을 우회하므로 호스트 레벨에서도 외부 노출을 막는다.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1.5g

  postgres:
    image: postgres:16
    container_name: nowhere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowhere
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d nowhere"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 800m

  redis:
    image: redis:7-alpine
    container_name: nowhere-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

volumes:
  postgres-data:
