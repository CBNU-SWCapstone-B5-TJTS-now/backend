services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nowhere-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1.5g

  postgres:
    image: postgres:16
    container_name: nowhere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowhere
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d nowhere"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 800m

  redis:
    image: redis:7-alpine
    container_name: nowhere-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

volumes:
  postgres-data:
