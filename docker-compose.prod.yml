# app-blue / app-green 공통 설정. 무중단 배포를 위해 둘을 번갈아 띄운다.
x-app: &app
  # GitHub Actions가 빌드해 GHCR에 올린 이미지를 받아서 실행한다 (서버에서 빌드하지 않음).
  # 배포 스크립트(infra/deploy/deploy.sh)가 APP_IMAGE로 커밋별 이미지(sha-xxxxxxx)를 지정한다.
  image: ${APP_IMAGE:-ghcr.io/cbnu-swcapstone-b5-tjts-now/backend:latest}
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: prod
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 1.5g
  # 종료 시 처리 중인 요청을 마무리할 시간 (Spring graceful shutdown 기본 30초)
  stop_grace_period: 35s

services:
  # Nginx가 바라보는 쪽(활성)은 /etc/nginx/snippets/nowhere-upstream.conf의 포트로 정해진다.
  # profiles 때문에 `docker compose up -d`만으로는 app이 뜨지 않고, 서비스명을 지정해야 뜬다.
  # 포트는 127.0.0.1에만 바인딩한다 (Docker는 방화벽을 우회하므로 호스트 레벨에서도 외부 노출을 막음).
  app-blue:
    <<: *app
    container_name: nowhere-app-blue
    profiles: [blue]
    ports:
      - "127.0.0.1:8080:8080"

  app-green:
    <<: *app
    container_name: nowhere-app-green
    profiles: [green]
    ports:
      - "127.0.0.1:8081:8080"

  postgres:
    image: postgres:16
    container_name: nowhere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowhere
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d nowhere"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 800m

  redis:
    image: redis:7-alpine
    container_name: nowhere-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

volumes:
  postgres-data:
