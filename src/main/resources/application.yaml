spring:
  application:
    name: nowhere

  datasource:
    url: jdbc:postgresql://localhost:5432/nowhere
    username: nowhere
    password: nowhere1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

logging:
  charset:
    console: UTF-8
    file: UTF-8

jwt:
  secret: nowhere-secret-key-for-jwt-signing-must-be-long-enough
  expiration: 86400000
