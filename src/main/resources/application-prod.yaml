spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nowhere
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.nowhere.backend: INFO
