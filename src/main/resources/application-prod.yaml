spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nowhere
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.nowhere.backend: INFO

app:
  cors:
    # 웹 프론트가 배포될 origin. 도메인이 정해지면 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nowhere-app.cloud,https://www.nowhere-app.cloud}
