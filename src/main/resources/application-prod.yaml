spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nowhere
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: ${JWT_SECRET}

# 배포 파이프라인 헬스체크용. health만 노출하고 상세 정보(DB/Redis 상태)는 숨긴다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.nowhere.backend: INFO

app:
  cors:
    # 웹 프론트가 배포될 origin. 도메인이 정해지면 CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nowhere-app.cloud,https://www.nowhere-app.cloud,https://nowhere-admin-web.vercel.app}
    # Vercel 프리뷰 배포(nowhere-admin-web-<hash>-<team>.vercel.app 등). 와일드카드 패턴.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://nowhere-admin-web-*.vercel.app}
