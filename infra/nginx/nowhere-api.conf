# Nowhere — reverse proxy for the Spring Boot backend.
# Deployed to /etc/nginx/conf.d/nowhere-api.conf
#
# api.nowhere-app.cloud  -> localhost:8080 (Spring Boot container)
# nowhere-app.cloud/www  -> minimal status response (no front-end yet)
#
# TLS listeners and the HTTP->HTTPS redirect are managed by Certbot
# (certbot --nginx), which edits this file in place on issue/renew.

upstream nowhere_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    server_name api.nowhere-app.cloud;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    client_max_body_size 10m;

    # --- SSE endpoints: unbuffered, long-lived ---------------------------
    location = /api/locations/stream {
        proxy_pass http://nowhere_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/sse-common.conf;
    }

    location = /api/sse/notifications {
        proxy_pass http://nowhere_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/sse-common.conf;
    }

    location ~ ^/api/sos/posts/[^/]+/stream$ {
        proxy_pass http://nowhere_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/sse-common.conf;
    }

    # --- everything else --------------------------------------------------
    location / {
        proxy_pass http://nowhere_backend;
        include /etc/nginx/snippets/proxy-common.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.nowhere-app.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.nowhere-app.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name nowhere-app.cloud www.nowhere-app.cloud;

    access_log /var/log/nginx/root.access.log;
    error_log  /var/log/nginx/root.error.log;

    # No front-end is served from the apex yet. Keep the API off this
    # hostname so there is exactly one public API origin, and answer with a
    # plain status line so the domain (and its certificate) stay verifiable.
    location / {
        default_type text/plain;
        return 200 "nowhere-app.cloud is up. API: https://api.nowhere-app.cloud\n";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.nowhere-app.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.nowhere-app.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}


server {
    if ($host = api.nowhere-app.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    listen      [::]:80;
    server_name api.nowhere-app.cloud;
    return 404; # managed by Certbot


}

server {
    if ($host = www.nowhere-app.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nowhere-app.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    listen      [::]:80;
    server_name nowhere-app.cloud www.nowhere-app.cloud;
    return 404; # managed by Certbot




}